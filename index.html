<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diamonds Parking</title>

  <style>
    :root{
      --bg:#f4f6f8; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
      --banner:#d7eef3; --bannerText:#1f2937;
      --primary:#0ea5b7; --primaryDark:#0b7f8d; --apple:#111111; --paypal:#f4c542;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg)}
    .hero{position:relative;height:155px;overflow:hidden;background:#111}
    .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.65),rgba(0,0,0,.2)),url("../assets/hero-cars.jpg") center/cover no-repeat}
    .heroInner{position:relative;height:100%;display:flex;align-items:center;gap:14px;padding:18px;color:#fff}
    .badge{width:62px;height:62px;border-radius:14px;background:#0b5fa8;display:grid;place-items:center;border:2px solid rgba(255,255,255,.15);flex:0 0 auto}
    .badge span{font-weight:800;font-size:34px;line-height:1}
    .heroText h1{margin:0;font-size:18px;letter-spacing:.2px}
    .heroText p{margin:6px 0 0;font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
    .banner{background:var(--banner);color:var(--bannerText);padding:12px 16px;font-size:13px;letter-spacing:.2px;border-bottom:1px solid rgba(0,0,0,.04);text-transform:uppercase}
    .card{padding:16px}
    .fieldLabelRow{display:flex;justify-content:space-between;align-items:center;margin-top:6px;margin-bottom:6px}
    .fieldLabelRow .label{font-weight:700;font-size:16px}
    .scanBtn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#e11d48;background:transparent;border:none;padding:8px;border-radius:10px;cursor:pointer}
    .scanBtn:hover{background:rgba(225,29,72,.08)}
    .input,.select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;font-size:16px;outline:none}
    .input:focus,.select:focus{border-color:rgba(14,165,183,.55);box-shadow:0 0 0 4px rgba(14,165,183,.12)}
    .sectionTitle{font-weight:700;font-size:16px;margin:18px 0 10px}
    .mutedRow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:14px}
    .linkish{color:#d12b53;font-weight:600;cursor:pointer;user-select:none}
    .totals{margin-top:16px;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;align-items:baseline}
    .totals .totalLabel{font-weight:800;font-size:18px;letter-spacing:.2px}
    .totals .totalValue{font-weight:800;font-size:22px}
    .terms{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}
    .terms a{color:#0b6b93;text-decoration:none;font-weight:600}
    .terms a:hover{text-decoration:underline}
    .btn{width:100%;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;border:none;cursor:pointer;margin-top:12px}
    .btnApple{background:#111;color:#fff}
    .or{text-align:center;color:var(--muted);font-size:12px;margin:14px 0 4px;letter-spacing:.2px;text-transform:uppercase}
    .btnPrimary{background:var(--primary);color:#fff}
    .btnPrimary:hover{background:var(--primaryDark)}
    .btnPayPal{background:var(--paypal);color:#123}
    .error{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(225,29,72,.08);color:#9f1239;font-size:14px;display:none}
    .footerPad{height:26px}
  </style>
</head>
